services:

  # ═══════════════════════════════════════════════════════════════
  # BASE DE DATOS
  # ═══════════════════════════════════════════════════════════════
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    ports:
      # 5433 en la máquina (el 5432 lo suele tener el Postgres de Windows),
      # 5432 dentro del contenedor.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Corre solo la primera vez que se crea el volumen.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════════
  # BACKEND
  # ═══════════════════════════════════════════════════════════════
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      # "db" es el nombre del servicio. NO es localhost: dentro de Docker,
      # localhost sería el propio contenedor backend.
      DB_HOST: db
      # Acá SÍ es 5432: el puerto real del contenedor. El 5433 era solo el
      # puerto publicado en la máquina, para cuando el backend corre fuera
      # de Docker.
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      db:
        # Espera a que la base esté SALUDABLE, no solo a que arrancó.
        # Sin esto el backend intenta conectarse antes de que la base
        # acepte conexiones y queda reiniciándose en bucle.
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3000:3000"

  # ═══════════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════════
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata: