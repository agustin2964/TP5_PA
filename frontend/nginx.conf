# Nginx reemplaza a Vite en producción.
#
# En desarrollo, Vite hace de servidor y de proxy. En producción no hay Vite:
# se compila el frontend y Nginx sirve los archivos estáticos.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── El proxy ──────────────────────────────────────────────
    #
    # Lo que empieza con /api NO es un archivo del frontend: se lo
    # reenvía al backend.
    #
    # Ojo el "backend": ese es el NOMBRE DEL SERVICIO en el compose. Dentro
    # de la red de Docker los contenedores se ven por nombre, no por
    # localhost (localhost sería el propio Nginx).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cualquier otra cosa la resuelve React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}